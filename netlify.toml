[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# BEGIN old-address page redirects (domain_switch.py)
# Pages only. MCP and API paths on the old address keep answering directly.
[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/"
  to = "https://icp-intelligence.gtmhelix.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/index.html"
  to = "https://icp-intelligence.gtmhelix.com/index.html"
  status = 301
  force = true

[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/privacy"
  to = "https://icp-intelligence.gtmhelix.com/privacy"
  status = 301
  force = true

[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/privacy.html"
  to = "https://icp-intelligence.gtmhelix.com/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/sitemap.xml"
  to = "https://icp-intelligence.gtmhelix.com/sitemap.xml"
  status = 301
  force = true

[[redirects]]
  from = "https://icp-intelligence-mcp.netlify.app/llms.txt"
  to = "https://icp-intelligence.gtmhelix.com/llms.txt"
  status = 301
  force = true

# END old-address page redirects
