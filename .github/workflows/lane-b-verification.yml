name: Lane B branch verification
on:
  push:
    branches: [codex/round4-20261102]
    paths:
      - 'netlify/**'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - '.github/workflows/lane-b-verification.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-verification-workspace
          path: |
            node_modules/
            src/
            dist/
            tests/
            netlify/
            scripts/
            public/
            package.json
            package-lock.json
            tsconfig.json
            *.html
            *.json
            *.md
            *.txt
            *.toml
            assets/*.css
            assets/js/
            assistant/
            bin/
            _headers
            _redirects
            sample-report/
          retention-days: 1
