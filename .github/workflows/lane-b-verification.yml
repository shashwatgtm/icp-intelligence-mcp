name: Lane B branch verification
on:
  push:
    branches: [codex/round4-20261102]
    paths:
      - 'netlify/**'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/lane-b-verification.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproduce the committed build profile
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {BUILD_PROFILE as p} from './src/build-profile.ts';
          execFileSync(process.execPath,['scripts/build-profile.mjs'],{stdio:'inherit',env:{...process.env,HELIX_PROFILE:p.profile,WAVE_PAYLOAD:p.payload,WIDGET_UI_DOMAIN:p.domainEnabled?'on':'off'}});
          execFileSync('git',['diff','--exit-code','--','src/build-profile.ts','dist'],{stdio:'inherit'});
          JS
      - run: node --test --test-concurrency=1 tests/*.test.mjs
